---
- name: "systemd_helper | Deploy sysusers"
  ansible.builtin.template:
    src: "systemd_sysusers.j2"
    dest: "{{ '/etc/sysusers.d/' ~ lookup('ansible.builtin.vars',
      'outer_item') ~ '.conf' }}"
    group: "root"
    owner: "root"
    mode: "0644"
    force: "yes"
  loop: "{{ hostvars[inventory_hostname]['systemd_sysusers'] |
    community.general.json_query(\"[].create[?file_name=='\" +
    lookup('ansible.builtin.vars', 'outer_item') + \"']\") |
    flatten(levels=1) }}"
  loop_control:
    label: "{{ item['file_name'] }}"
  register: "systemd_sysusers_deploy_result"
- name: "systemd_helper | Touch /usr for systemd-update-done service"
  ansible.builtin.file:
    path: "/usr"
    state: "touch"
    mode: "0755"
  when:
    - "lookup('ansible.builtin.vars', 'systemd_sysusers_deploy_result') is
      changed"
    - "lookup('ansible.builtin.vars', 'systemd_sysusers_deploy_result') is
      success"
  diff: false
